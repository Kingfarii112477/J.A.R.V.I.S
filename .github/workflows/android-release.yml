name: Android Release Build

# Builds the native Android shell (see capacitor.config.ts + /android) as a
# signed APK and AAB. Triggers on pushes to main and on version tags
# (v1.0.0, v1.2.3, ...) for production releases, plus workflow_dispatch for
# manual/verification runs from any branch. Never runs on pull requests from
# forks, since it would have no access to the signing secrets anyway.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # only used by the "attach to GitHub Release" step on a tag push

env:
  # Pinned versions — the "build matrix" the pipeline verifies below.
  # Bump deliberately, in lockstep with android/variables.gradle and
  # android/gradle/wrapper/gradle-wrapper.properties, never independently.
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build signed Android APK + AAB
    runs-on: ubuntu-latest
    env:
      # Step-level `if:` conditions can't reference the `secrets` context
      # directly (GitHub Actions restriction) — resolve it into a job env
      # var here instead, which `if:` CAN read.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Next.js application
        # Also serves as the typecheck gate: `next build` runs a full
        # TypeScript check as one of its own build phases and fails the
        # step on any type error. A separate `tsc --noEmit` step run
        # BEFORE this one would fail on a clean checkout regardless of
        # real errors — Next.js writes ambient route types (e.g.
        # LayoutProps) into .next/types/ only as part of this build, so
        # tsc has nothing to resolve those names against until after it
        # runs at least once.
        run: npm run build

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            platform-tools

      - name: Report build matrix
        run: |
          echo "Node:            $(node -v)"
          echo "npm:             $(npm -v)"
          echo "Java:            $(java -version 2>&1 | head -1)"
          echo "Android platform: android-${{ env.ANDROID_PLATFORM }}"
          echo "Android build-tools: ${{ env.ANDROID_BUILD_TOOLS }}"
          echo "Gradle wrapper:  $(grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties)"

      - name: Sync Capacitor Android project
        run: npx cap sync android
        env:
          # Optional override — capacitor.config.ts already defaults to the
          # deployed Netlify URL. Set the CAPACITOR_SERVER_URL repository
          # variable only if the app should point somewhere else.
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}

      - name: Restore release keystore from secret
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Optional: enables the on-device Porcupine wake word. Absent, the
          # build still succeeds and continuous listening reports wake-word
          # detection as unconfigured rather than faking it.
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Optional: enables the on-device Porcupine wake word. Absent, the
          # build still succeeds and continuous listening reports wake-word
          # detection as unconfigured rather than faking it.
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}

      - name: Verify artifacts were produced
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$APK" ]; then
            # No secret configured: Gradle's conditional signingConfig (see
            # android/app/build.gradle) leaves the output unsigned, which
            # Android Gradle Plugin names differently.
            APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          test -f "$APK" || { echo "::error::No release APK was produced at all."; exit 1; }
          test -f "$AAB" || { echo "::error::Release AAB not found at $AAB"; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo "AAB size: $(du -h "$AAB" | cut -f1)"

      - name: Verify APK signature and report signing status
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
          {
            if [[ "$APK_PATH" == *unsigned* ]]; then
              echo "### ⚠️ Unsigned build" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "No ANDROID_KEYSTORE_BASE64 repository secret is configured, so this APK/AAB is **not signed** and is not installable on a real device or uploadable to Google Play. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD as repository secrets to produce a genuinely signed release — see the Android section of the README." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ✅ Signed release build" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              "$BUILD_TOOLS/apksigner" verify --print-certs "$APK_PATH" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          }

      - name: Assemble named artifacts
        run: |
          mkdir -p dist
          cp "$APK_PATH" dist/JARVIS-release.apk
          cp "$AAB_PATH" dist/JARVIS-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-release-apk
          path: dist/JARVIS-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-release-aab
          path: dist/JARVIS-release.aab
          retention-days: 30

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/JARVIS-release.apk
            dist/JARVIS-release.aab
