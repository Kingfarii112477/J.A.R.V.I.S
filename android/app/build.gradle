apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing — deliberately never hardcoded. GitHub Actions
// (.github/workflows/android-release.yml) decodes the ANDROID_KEYSTORE_BASE64
// secret to android/app/release.keystore and exports ANDROID_KEYSTORE_PASSWORD /
// ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD as env vars before invoking Gradle.
// For local release-build testing, copy android/keystore.properties.example to
// android/keystore.properties (already gitignored, same as every *.keystore/
// *.jks file) instead of exporting env vars — env vars always win when both
// are present. Neither path is required: with nothing configured, `release`
// simply builds unsigned (fine for local testing; CI always has the real
// secrets), so assembleDebug/assembleRelease never break for a plain checkout.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigningValue = { String envName, String propName ->
    return System.getenv(envName) ?: keystoreProperties.getProperty(propName)
}

def releaseStorePassword = resolveSigningValue("ANDROID_KEYSTORE_PASSWORD", "storePassword")
def releaseKeyAlias = resolveSigningValue("ANDROID_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = resolveSigningValue("ANDROID_KEY_PASSWORD", "keyPassword")
def releaseStoreFile = file(resolveSigningValue("ANDROID_KEYSTORE_PATH", "storeFile") ?: "release.keystore")
def hasReleaseSigning = releaseStorePassword && releaseKeyAlias && releaseKeyPassword && releaseStoreFile.exists()

// Picovoice AccessKey for the on-device Porcupine wake-word engine.
// Resolved exactly like the signing credentials above — env var first, then
// an optional gitignored android/keystore.properties — and NEVER hardcoded.
// An empty value is a fully supported configuration: the native
// WakeWordEngine reports itself unavailable and the app honestly says
// wake-word detection is unconfigured rather than faking it. Get a free key
// at https://console.picovoice.ai (detection itself runs entirely offline;
// the key is validated locally at engine init).
def picovoiceAccessKey = resolveSigningValue("PICOVOICE_ACCESS_KEY", "picovoiceAccessKey") ?: ""

android {
    namespace = "com.jarvis.aios"
    compileSdk = rootProject.ext.compileSdkVersion
    kotlinOptions {
        jvmTarget = "21"
    }
    defaultConfig {
        applicationId "com.jarvis.aios"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep in sync with the pattern documented in README's Android
        // section: versionCode is a monotonically increasing integer Google
        // Play uses to order releases (bump on every release build);
        // versionName is the human-readable string shown to users.
        versionCode 100
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "PICOVOICE_ACCESS_KEY", "\"${picovoiceAccessKey}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : null
        }
    }
    buildFeatures {
        // Required for the PICOVOICE_ACCESS_KEY buildConfigField above (AGP 8
        // no longer generates BuildConfig unless asked).
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // On-device wake-word detection (Porcupine). Ships a built-in "Jarvis"
    // keyword and runs entirely offline — no audio ever leaves the device
    // during standby listening. See ContinuousListeningService.kt.
    implementation "ai.picovoice:porcupine-android:$porcupineVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
